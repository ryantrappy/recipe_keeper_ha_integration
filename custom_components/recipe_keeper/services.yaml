search_recipes:
  name: Search recipes
  description: Search recipes.
  fields:
    config_entry_id:
      name: Account
      selector:
        config_entry:
          integration: recipe_keeper
      required: true
    query:
      name: Search words
      selector:
        text: {}
    limit:
      name: Result limit
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      name: Result offset
      selector:
        number:
          min: 0
          mode: box
