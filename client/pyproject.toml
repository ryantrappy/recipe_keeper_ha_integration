[project]
name = "recipe-keeper-client"
version = "0.2.0"
description = "Recipe Keeper cloud sync client with persistent guarded editing"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4", "pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_keeper_client"]
