[project]
name = "recipe-assistant-api"
version = "0.1.0"
description = "Recipe Keeper bridge with optional cloud editing for Home Assistant"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "aiohttp>=3.12,<4"]

[project.scripts]
recipe-assistant = "recipe_assistant.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_assistant"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
